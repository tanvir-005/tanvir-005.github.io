name: Deploy site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]   # sent by "Publish site" in the admin panel
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"       # weekly, keeps the Codeforces rating fresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_URL: ${{ vars.API_URL }}
      VITE_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Build public site
        run: pnpm --filter web build
      - name: Build admin panel
        run: pnpm --filter admin build
      - name: Place admin under /admin
        run: |
          mkdir -p packages/web/dist/admin
          cp -r packages/admin/dist/* packages/web/dist/admin/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
